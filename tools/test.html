<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Curtain Lite</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <div class="brand">IRON CURTAIN <span>LITE</span></div>
  <div class="year" id="year">1947</div>
  <div class="chip" id="ip" title="Influence Points: spend them on countries. You get more each year."></div>
  <div class="chip" id="tension" title="World tension. If it reaches 100, nuclear war ends the game for everyone."></div>
  <div class="chip score" id="score" title="Score: the value of every country in your bloc, plus bonuses from events."></div>
  <div class="grow"></div>
  <button id="detente" class="ghost" title="A summit with your rival: tension −15. Once a year.">☮ Détente</button>
  <button id="finish" class="ghost" hidden>End game</button>
  <button id="help" class="ghost" title="How to play">?</button>
  <button id="end" class="primary" title="End the year (Enter)">End Year ▸</button>
</header>
<main>
  <section id="mapbox">
    <svg id="map" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="tip" hidden></div>
    <div id="legend">
      <div class="modes"><button data-mode="nat" class="on" title="Every country in its own colour (1)">Nations</button><button data-mode="pact" title="Alliances (2)">Alliances</button><button data-mode="rel" title="How the world sees you (3)">Relations</button><button data-mode="mil" title="Army sizes (4)">Military</button><button data-mode="gov" title="Kinds of government (5)">Government</button><button data-mode="stab" title="Stability (6)">Stability</button></div>
      <div class="keys"><span id="legend-dyn"></span><span><i class="hatch"></i>Colony</span><span>⚔ Civil war</span><span style="color:#ffa040">➜ War</span></div>
    </div>
    <ol id="news"></ol>
  </section>
  <aside id="panel"></aside>
</main>
<div id="modal" hidden><div class="card" id="card"></div></div>
<div id="toast" hidden></div>

<script>window.onerror=(m,u,l,c,e)=>{const d=document.createElement("pre");d.style.cssText="position:fixed;top:0;left:0;z-index:99;background:#fff;color:#000";d.textContent="ERR "+m+" @"+l;document.body.appendChild(d)};</script>
<script>window.NO_ANIM=location.hash.includes("still"); window.NO_WAIT=true;</script>
<script src="../lib/d3.min.js"></script>
<script src="../lib/topojson-client.min.js"></script>
<script src="../lib/provinces.js"></script>
<script src="../data.js"></script>
<script src="../provinces.js"></script>
<script src="../neighbours.js"></script>
<script src="../game.js"></script>
<script src="../ui.js"></script>
<script>
const q=s=>document.querySelector(s); const [side,yrs,pick]=location.hash.slice(1).split(',');
q('[data-side="'+(side||'US')+'"]').click();
for(let y=0;y<(+yrs||0);y++){ let n=0; if(q('#onward')&&!location.hash.includes('verdict')) q('#onward').click(); while(q('[data-i]')&&n++<9) q('[data-i]').click(); if (ironCurtain.game.side) GAME.computerTurn(ironCurtain.game, ironCurtain.game.side); q('#end').click(); }
{let n=0; while(q('[data-i]')&&n++<9) q('[data-i]').click();}
if(location.hash.includes('formit')){ const g=ironCurtain.game; for(const k of ['BEL','LUX']) g.c[k].a=g.c.NLD.a; g.ip.ME=30; GAME.form(g,'benelux');
  g.c.FRG.army=1; g.wars=[]; GAME.act(g,'ME','invade','FRG'); g.wars[0].front=99; g.wars[0].years=3; ironCurtain.refresh(); document.getElementById('end').click(); }
if(location.hash.includes('cutit')){ const g=ironCurtain.game; g.cuts=[]; GAME.cutLand(g,'IRN','IRQ',0.35); GAME.cutLand(g,'KOR','PRK',0.6); GAME.cutLand(g,'POL','SUN',0.5); GAME.cutLand(g,'IND','PAK',0.5); ironCurtain.refresh(); }
if(location.hash.includes('occit')){ const g=ironCurtain.game; g.peace={win:'EGY',lose:'SAU'}; GAME.conference(g,['annex']); g.c.SAU.occ.unrest=72; g.c.SAU.occ.integ=30;
  GAME.cutLand(g,'ISR','EGY',0.6); if(g.cuts[0]) g.cuts[0].occ={unrest:20,integ:55,policy:'integrate',core:false,acted:0}; ironCurtain.refresh(); }
if(location.hash.includes('stage')){ const g=ironCurtain.game; g.wars=[]; GAME.civilWar; 
  const add=(a,d,f,p)=>{g.wars.push({id:g.wars.length+1,att:a,def:d,front:f,prev:p,years:2,help:{att:0,def:0},troops:{},armed:{}})};
  add("IRQ","IRN",55,25); add("PAK","IND",35,15); add("ARG","GBR",40,20); add("SOM","ETH",-30,-55); ironCurtain.refresh(); }
if(location.hash.includes('customs')){ const g=ironCurtain.game; g.wars=[]; for(const k of ['VNM','RVN']) g.c[k].independent=true; g.c.RVN.a=50; g.c.VNM.a=-60; g.c.CHN.war=null;
  const add=(a,d,f,p)=>{g.wars.push({id:g.wars.length+1,att:a,def:d,front:f,prev:p,years:2,help:{att:0,def:0},troops:{},armed:{},capFell:{}})};
  add('VNM','RVN',45,20); add('CHN','TIB',50,30); g.c.KUR.war={rebels:'SU',balance:-30,years:2,help:{US:0,SU:0},troops:{},sep:true};
  g.c.UKR.owner=null; g.c.UKR.a=20; g.c.CRM.owner='UKR'; add('SUN','UKR',35,15); g.c.SCO.owner=null; g.c.SCO.a=30; add('GBR','SCO',-25,-10); ironCurtain.refresh(); }
if(location.hash.includes('states')){ const g=ironCurtain.game; g.wars=[]; g.c.GRC.war=null; g.c.CHN.war=null;
  const add=(a,d,f,p)=>{g.wars.push({id:g.wars.length+1,att:a,def:d,front:f,prev:p,years:2,help:{att:0,def:0},troops:{},armed:{},capFell:{}})};
  add('ROU','SUN',40,20); add('HUN','YUG',45,25); add('IRL','GBR',35,15); add('CHN','SUN',30,10); ironCurtain.refresh(); }
if(pick){ const p=[...document.querySelectorAll('path.land')].find(p=>p.__data__&&p.__data__.key===pick); if(p) p.dispatchEvent(new MouseEvent(location.hash.includes('dbl')?'dblclick':'click',{bubbles:true})); }
const zm=location.hash.match(/z=(\w+)/); if(zm) ironCurtain.zoomTo(zm[1]);
const mm=location.hash.match(/mode=(\w+)/); if(mm) document.querySelector('[data-mode="'+mm[1]+'"]').click();
if(location.hash.includes('mid')){ const t0=performance.now(); while(performance.now()-t0<800); d3.timerFlush(); }
const vm=location.hash.match(/v=(-?[\d.]+):(-?[\d.]+):([\d.]+)/); if(vm) ironCurtain.view(+vm[1],+vm[2],+vm[3]);
const dm=location.hash.match(/dbg=([A-Z]+):([A-Z]+)/); if(dm){ const f=ironCurtain.frontField(dm[1],dm[2]); const p=document.createElement('pre'); p.id='dbg'; p.textContent='DBG '+JSON.stringify({border:f.borderD.slice(0,300), size:f.size, th:f.thrusts.length, d25:f.at(0.25).d.length, d90:f.at(0.9).d.length, heart:f.heart}); document.body.appendChild(p); }
</script></body>
</html>
