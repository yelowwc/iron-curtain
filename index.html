<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Curtain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">IRON CURTAIN</div>
  <div class="year" id="year">1947</div>
  <div class="chip" id="ip" title="Influence Points: spend them on countries. You get more each year."></div>
  <div class="chip" id="tension" title="World tension. If it reaches 100, nuclear war ends the game for everyone."></div>
  <div class="chip score" id="score" title="Score: the value of every country in your bloc, plus bonuses from events."></div>
  <div class="grow"></div>
  <button id="detente" class="ghost" title="A summit with your rival: tension −15. Once a year.">☮ Détente</button>
  <button id="finish" class="ghost" title="End the game and see how you did" hidden>End game</button>
  <button id="help" class="ghost" title="How to play">?</button>
  <button id="end" class="primary" title="End the year (Enter)">End Year ▸</button>
</header>
<main>
  <section id="mapbox">
    <svg id="map" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="tip" hidden></div>
    <div id="legend">
      <div class="modes"><button data-mode="nat" class="on" title="Every country in its own colour (1)">Nations</button><button data-mode="pact" title="Alliances (2)">Alliances</button><button data-mode="rel" title="How the world sees you (3)">Relations</button><button data-mode="mil" title="Army sizes (4)">Military</button><button data-mode="gov" title="Kinds of government (5)">Government</button><button data-mode="stab" title="Stability (6)">Stability</button></div>
      <div class="keys"><span id="legend-dyn"></span><span><i class="hatch"></i>Colony</span><span>⚔ Civil war</span><span style="color:#ffa040">➜ War</span></div>
    </div>
    <ol id="news"></ol>
  </section>
  <aside id="panel"></aside>
</main>
<div id="modal" hidden><div class="card" id="card"></div></div>
<div id="toast" hidden></div>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/provinces.js"></script>
<script src="data.js"></script>
<script src="provinces.js"></script>
<script src="neighbours.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
